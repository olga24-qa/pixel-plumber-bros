<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Plumber Bros</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Courier New", monospace; }
  .tv {
    padding: 26px; background: #1a1a1f; border-radius: 40px;
    box-shadow: inset 0 0 0 4px #2b2b33, inset 0 0 30px #000, 0 10px 40px #000;
  }
  .screen { position: relative; width: 900px; height: 600px; border-radius: 22px; overflow: hidden; background: #000; }
  canvas { width: 900px; height: 600px; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%);
  }
  .hint { position: fixed; bottom: 8px; width: 100%; text-align: center; color: #667; font-size: 13px; }
</style>
</head>
<body>
<div class="tv"><div class="screen"><canvas id="c" width="300" height="200"></canvas></div></div>
<div class="hint">← → / A D — бег · Пробел / ↑ / W — прыжок · Shift — ускорение · Enter — старт</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const VW = 300, VH = 200, T = 16, ROWS = 12, YOFF = 8;

// ---------- Палитра (как на NES) ----------
const SKY = '#5c94fc', GROUND = '#c84c0c', GROUND_D = '#000000', BRICK = '#b8541c',
      QBLK = '#fcb800', QBLK_D = '#a85000', USED = '#7c4c1c', GREEN = '#00a800', GREEN_L = '#80d010', GREEN_D = '#005800';

// ---------- Спрайты (рисуются кодом) ----------
function sprite(rows, pal) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c;
}
const PP = { r: '#e40058', s: '#fcbc78', b: '#6c3400', u: '#0058f8' };
const head = [
  '...rrrrr....', '..rrrrrrrrr.', '..bbbssbs...', '.bsbsssbsss.',
  '.bsbbsssbsss', '.bbssssbbbb.', '...sssssss..', '..rruurr....',
  '.rrruurruurr', 'rrrruuuuurrr', 'ss.uuuuuu.ss', 'sss.uuuu.sss'];
const P_IDLE = sprite([...head, '..uuu..uuu..', '.bbbb..bbbb.'], PP);
const P_WALK = sprite([...head, '.uuu....uuu.', 'bbbb.....bbb'], PP);
const P_JUMP = sprite([...head, 'uuu......uuu', 'bbb......bbb'], PP);
const GP = { n: '#a84800', w: '#fcfcfc', k: '#000000', c: '#fcc47c', b: '#6c3400' };
const GOOMBA = sprite([
  '....nnnnnn....', '..nnnnnnnnnn..', '.nnnnnnnnnnnn.', '.nnwwnnnnwwnn.',
  'nnnwwwnnwwwnnn', 'nnnwkwnnwkwnnn', 'nnnwwwnnwwwnnn', 'nnnnnnnnnnnnnn',
  '.nnnnnnnnnnnn.', '..ccccccccc...', '..cccccccccc..', '..cccccccccc..',
  '.bbbb....bbbb.', 'bbbbb....bbbbb'], GP);

// ---------- Уровень ----------
const W = 120;
let grid;
const SOLID = '#BLRlrSU?';
function buildLevel() {
  grid = Array.from({ length: ROWS }, () => Array(W).fill('.'));
  const gaps = [[38, 39], [70, 72], [95, 96]];
  for (let c = 0; c < W; c++) {
    if (gaps.some(([a, b]) => c >= a && c <= b)) continue;
    grid[10][c] = '#'; grid[11][c] = '#';
  }
  const put = (c, r, ch) => { grid[r][c] = ch; };
  [[16, 7, '?'], [20, 7, 'B'], [21, 7, '?'], [22, 7, 'B'], [23, 7, '?'], [22, 3, '?'], [21, 7, '?'],
   [74, 7, 'B'], [75, 7, 'B'], [76, 7, '?'], [77, 7, 'B'], [78, 7, 'B'], [88, 7, '?'], [90, 7, 'B']
  ].forEach(([c, r, ch]) => put(c, r, ch));
  const pipe = (c, h) => {
    const top = 10 - h;
    put(c, top, 'L'); put(c + 1, top, 'R');
    for (let r = top + 1; r < 10; r++) { put(c, r, 'l'); put(c + 1, r, 'r'); }
  };
  pipe(28, 2); pipe(44, 3); pipe(54, 3); pipe(80, 2);
  [[16, 5], [20, 5], [22, 5], [38, 7], [39, 7], [70, 6], [71, 5], [72, 6], [95, 7], [96, 7], [60, 8], [61, 8], [62, 8]]
    .forEach(([c, r]) => put(c, r, 'C'));
  for (let i = 0; i < 4; i++) for (let h = 0; h <= i; h++) put(103 + i, 9 - h, 'S');
  for (let i = 0; i < 4; i++) for (let h = 0; h <= 3 - i; h++) put(108 + i, 9 - h, 'S');
  for (let r = 2; r < 10; r++) put(116, r, 'F');
}
const ENEMY_COLS = [18, 34, 50, 59, 62, 66, 78, 85, 92, 100];
const solid = (c, r) => {
  if (c < 0 || c >= W) return true;
  if (r < 0 || r >= ROWS) return false;
  return SOLID.includes(grid[r][c]);
};

// ---------- Звук (WebAudio, без файлов) ----------
let ac = null;
function beep(freq, dur, type = 'square', slide = 0, vol = 0.05) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  jump: () => beep(300, 0.18, 'square', 300),
  coin: () => { beep(988, 0.07); setTimeout(() => beep(1319, 0.2), 70); },
  stomp: () => beep(200, 0.12, 'square', -100),
  bump: () => beep(120, 0.08),
  die: () => beep(500, 0.6, 'square', -420),
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18), i * 130)),
};

// ---------- Ввод ----------
const keys = {}, pressed = {};
const BLOCK = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const left = () => keys.ArrowLeft || keys.KeyA;
const right = () => keys.ArrowRight || keys.KeyD;
const jumpHeld = () => keys.Space || keys.ArrowUp || keys.KeyW;
const jumpPressed = () => pressed.Space || pressed.ArrowUp || pressed.KeyW;
const run = () => keys.ShiftLeft || keys.ShiftRight || keys.KeyX;
const startPressed = () => pressed.Enter || pressed.Space;

// ---------- Состояние ----------
let state = 'title', stateT = 0, frame = 0;
let player, enemies, effects, camX, score = 0, coins = 0, lives = 3;

function resetLevel() {
  buildLevel();
  player = { x: 32, y: 10 * T - 14, w: 12, h: 14, vx: 0, vy: 0, face: 1, ground: false };
  enemies = ENEMY_COLS.map(c => ({ x: c * T, y: 10 * T - 14, w: 14, h: 14, vx: -0.5, vy: 0, dead: 0 }));
  effects = []; camX = 0;
}
function newGame() { score = 0; coins = 0; lives = 3; resetLevel(); state = 'play'; stateT = 0; }

// ---------- Физика ----------
function moveBody(b) {
  let hitTile = null, hitWall = false;
  b.x += b.vx;
  let c0 = Math.floor(b.x / T), c1 = Math.floor((b.x + b.w - 1) / T);
  let r0 = Math.floor(b.y / T), r1 = Math.floor((b.y + b.h - 1) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (!solid(c, r)) continue;
    if (b.vx > 0) b.x = c * T - b.w; else if (b.vx < 0) b.x = (c + 1) * T;
    b.vx = 0; hitWall = true;
    c0 = Math.floor(b.x / T); c1 = Math.floor((b.x + b.w - 1) / T);
  }
  b.y += b.vy; b.ground = false;
  c0 = Math.floor(b.x / T); c1 = Math.floor((b.x + b.w - 1) / T);
  r0 = Math.floor(b.y / T); r1 = Math.floor((b.y + b.h - 1) / T);
  const cx = b.x + b.w / 2;
  let best = null;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (!solid(c, r)) continue;
    if (b.vy > 0) { b.y = r * T - b.h; b.ground = true; }
    else if (b.vy < 0) {
      b.y = (r + 1) * T;
      const d = Math.abs(c * T + T / 2 - cx);
      if (!best || d < best.d) best = { c, r, d };
    }
  }
  if (b.ground && b.vy > 0) b.vy = 0;
  if (best) { b.vy = 0; hitTile = best; }
  return { hitTile, hitWall };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pop = (c, r, txt) => effects.push({ x: c * T + 2, y: r * T - 4, vy: -1.2, t: 40, txt });

function killPlayer() {
  if (state !== 'play') return;
  state = 'dying'; stateT = 0; player.vy = -4.5; player.vx = 0; sfx.die();
}

function updatePlay() {
  const p = player;
  const acc = p.ground ? 0.11 : 0.07, maxv = run() ? 2.2 : 1.5;
  if (left()) { p.vx -= acc; p.face = -1; }
  else if (right()) { p.vx += acc; p.face = 1; }
  else if (p.ground) { p.vx = Math.abs(p.vx) < 0.1 ? 0 : p.vx - Math.sign(p.vx) * 0.1; }
  p.vx = Math.max(-maxv, Math.min(maxv, p.vx));
  if (jumpPressed() && p.ground) { p.vy = -5.8; sfx.jump(); }
  p.vy += (p.vy < 0 && !jumpHeld()) ? 0.7 : 0.28;
  if (p.vy > 6) p.vy = 6;

  const res = moveBody(p);
  if (p.x < camX) { p.x = camX; p.vx = 0; }
  if (res.hitTile) {
    const { c, r } = res.hitTile, ch = grid[r][c];
    if (ch === '?') { grid[r][c] = 'U'; coins++; score += 200; pop(c, r, '+200'); sfx.coin(); }
    else sfx.bump();
  }
  // монеты и флаг
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - 1) / T);
  const r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - 1) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (r < 0 || r >= ROWS) continue;
    if (grid[r][c] === 'C') { grid[r][c] = '.'; coins++; score += 100; pop(c, r, '+100'); sfx.coin(); }
    if (grid[r][c] === 'F') { state = 'win'; stateT = 0; score += 1000; sfx.win(); return; }
  }
  if (p.y > ROWS * T + 20) { killPlayer(); return; }

  // враги
  for (const e of enemies) {
    if (e.dead) { e.dead--; continue; }
    if (Math.abs(e.x - camX - VW / 2) > 220) continue;
    e.vy = Math.min(e.vy + 0.28, 6);
    const dir = e.vx < 0 ? -1 : 1;
    const r = moveBody(e);
    if (r.hitWall) e.vx = -dir * 0.5; else if (e.vx === 0) e.vx = dir * 0.5;
    if (e.y > ROWS * T + 40) { e.dead = 1; e.gone = true; continue; }
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - e.y < 9) {
        e.dead = 30; p.vy = jumpHeld() ? -4.8 : -3.2; score += 100; pop(Math.floor(e.x / T), Math.floor(e.y / T), '+100'); sfx.stomp();
      } else { killPlayer(); return; }
    }
  }
  enemies = enemies.filter(e => !(e.gone));
  camX = Math.max(camX, Math.min(p.x - 110, W * T - VW));
  camX = Math.max(0, camX);
}

function update() {
  frame++;
  if (state === 'title') { if (startPressed()) newGame(); }
  else if (state === 'play') updatePlay();
  else if (state === 'dying') {
    stateT++; player.vy += 0.28; player.y += player.vy;
    if (stateT > 100) {
      lives--;
      if (lives > 0) { resetLevel(); state = 'play'; } else { state = 'over'; stateT = 0; }
    }
  } else if (state === 'over' || state === 'win') {
    stateT++; if (stateT > 30 && startPressed()) { state = 'title'; resetLevel(); }
  }
  for (const f of effects) { f.y += f.vy; f.t--; }
  effects = effects.filter(f => f.t > 0);
  for (const k in pressed) delete pressed[k];
}

// ---------- Отрисовка ----------
function drawTile(ch, x, y) {
  switch (ch) {
    case '#': case 'S':
      ctx.fillStyle = GROUND; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = GROUND_D; ctx.fillRect(x, y + 7, T, 1); ctx.fillRect(x + 7, y, 1, 7); ctx.fillRect(x + 3, y + 8, 1, 8); ctx.fillRect(x + 12, y + 8, 1, 8);
      ctx.fillStyle = '#fc9838'; ctx.fillRect(x, y, T, 1); ctx.fillRect(x, y, 1, 7);
      break;
    case 'B':
      ctx.fillStyle = BRICK; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#000'; ctx.fillRect(x, y + 3, T, 1); ctx.fillRect(x, y + 7, T, 1); ctx.fillRect(x, y + 11, T, 1); ctx.fillRect(x, y + 15, T, 1);
      ctx.fillRect(x + 7, y, 1, 3); ctx.fillRect(x + 3, y + 4, 1, 3); ctx.fillRect(x + 11, y + 4, 1, 3); ctx.fillRect(x + 7, y + 8, 1, 3); ctx.fillRect(x + 3, y + 12, 1, 3); ctx.fillRect(x + 11, y + 12, 1, 3);
      break;
    case '?': {
      const f = Math.floor(frame / 20) % 3;
      ctx.fillStyle = f === 2 ? '#fcd8a8' : QBLK; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = QBLK_D; ctx.fillRect(x, y + 15, T, 1); ctx.fillRect(x + 15, y, 1, T);
      ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 1, 1); ctx.fillRect(x + 13, y + 2, 1, 1); ctx.fillRect(x + 2, y + 13, 1, 1); ctx.fillRect(x + 13, y + 13, 1, 1);
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 6, y + 3, 4, 2); ctx.fillRect(x + 9, y + 5, 2, 3); ctx.fillRect(x + 7, y + 8, 2, 2); ctx.fillRect(x + 7, y + 11, 2, 2);
      break;
    }
    case 'U':
      ctx.fillStyle = USED; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 1, 1); ctx.fillRect(x + 13, y + 2, 1, 1); ctx.fillRect(x + 2, y + 13, 1, 1); ctx.fillRect(x + 13, y + 13, 1, 1);
      break;
    case 'L': case 'R': {
      ctx.fillStyle = GREEN; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#000'; ctx.fillRect(x, y, T, 1); ctx.fillRect(x, y + 15, T, 1);
      ctx.fillRect(ch === 'L' ? x : x + 15, y, 1, T);
      ctx.fillStyle = GREEN_L; ctx.fillRect(ch === 'L' ? x + 2 : x + 11, y + 2, 2, 12);
      ctx.fillStyle = GREEN_D; ctx.fillRect(ch === 'L' ? x + 12 : x + 3, y + 2, 2, 12);
      break;
    }
    case 'l': case 'r': {
      ctx.fillStyle = GREEN; ctx.fillRect(x + 1, y, 14, T);
      ctx.fillStyle = '#000'; ctx.fillRect(ch === 'l' ? x + 1 : x + 14, y, 1, T);
      ctx.fillStyle = GREEN_L; ctx.fillRect(ch === 'l' ? x + 3 : x + 9, y, 2, T);
      ctx.fillStyle = GREEN_D; ctx.fillRect(ch === 'l' ? x + 11 : x + 4, y, 2, T);
      break;
    }
    case 'C': {
      const w = [2, 4, 6, 4][Math.floor(frame / 8) % 4];
      ctx.fillStyle = '#fcb800'; ctx.fillRect(x + 8 - w / 2, y + 2, w, 12);
      ctx.fillStyle = '#fcd8a8'; ctx.fillRect(x + 8 - w / 2, y + 2, 1, 12);
      break;
    }
    case 'F': {
      const top = y;
      ctx.fillStyle = '#80d010'; ctx.fillRect(x + 7, top, 2, T);
      break;
    }
  }
}

function drawBackground() {
  ctx.fillStyle = SKY; ctx.fillRect(0, 0, VW, VH);
  // облака (параллакс)
  const cl = (wx, wy) => {
    const x = Math.round(wx - camX * 0.5), y = wy + YOFF;
    if (x < -50 || x > VW) return;
    ctx.fillStyle = '#fcfcfc';
    ctx.fillRect(x + 6, y, 18, 4); ctx.fillRect(x, y + 4, 32, 6); ctx.fillRect(x + 4, y + 10, 24, 2);
    ctx.fillStyle = '#a4e4fc'; ctx.fillRect(x + 4, y + 10, 24, 1);
  };
  [20, 130, 250, 360, 480, 600, 720, 840].forEach((x, i) => cl(x, 14 + (i % 3) * 14));
  // холмы
  const hill = (wx, w) => {
    const x = Math.round(wx - camX * 0.8), base = 10 * T + YOFF;
    if (x < -w || x > VW) return;
    ctx.fillStyle = '#00a800';
    for (let i = 0; i < w / 8; i++) ctx.fillRect(x + i * 4, base - 8 - Math.min(i, w / 8 - 1 - i) * 4, w - i * 8, 4);
    ctx.fillStyle = '#005800';
    ctx.fillRect(x + w / 2 - 4, base - 18, 3, 4); ctx.fillRect(x + w / 2 + 2, base - 18, 3, 4);
  };
  [0, 300, 560, 820, 1100, 1400].forEach(x => hill(x, 64));
}

function drawFlag() {
  const x = 116 * T - camX, y = 2 * T + YOFF;
  ctx.fillStyle = '#fcfcfc'; ctx.fillRect(x + 7, y - 6, 2, 6);
  ctx.fillStyle = '#00a800'; ctx.fillRect(x + 7, y - 8, 2, 2);
  ctx.fillStyle = '#fcfcfc'; ctx.beginPath(); ctx.moveTo(x + 7, y); ctx.lineTo(x - 8, y + 5); ctx.lineTo(x + 7, y + 10); ctx.fill();
}

function drawPlayer() {
  const p = player;
  let spr = P_IDLE;
  if (!p.ground) spr = P_JUMP; else if (Math.abs(p.vx) > 0.2) spr = Math.floor(p.x / 6) % 2 ? P_WALK : P_IDLE;
  const x = Math.round(p.x - camX) - 0, y = Math.round(p.y) + YOFF - 2;
  ctx.save();
  if (p.face < 0) { ctx.translate(x + p.w, y); ctx.scale(-1, 1); ctx.drawImage(spr, 0, 0); }
  else ctx.drawImage(spr, x, y);
  ctx.restore();
}

function text(s, x, y, size = 8, col = '#fcfcfc', align = 'left') {
  ctx.font = `bold ${size}px "Courier New", monospace`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const pad = (n, l) => String(n).padStart(l, '0');

function drawHUD() {
  text('PLUMBER', 8, 0, 8); text(pad(score, 6), 8, 8 - 0, 8, '#fcfcfc');
  text('x' + pad(coins, 2), 90, 8, 8, '#fcb800');
  text('WORLD', 160, 0, 8); text('1-1', 166, 8, 8);
  text('LIVES', 240, 0, 8); text('x' + lives, 252, 8, 8);
}

function draw() {
  drawBackground();
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(W - 1, c0 + 20);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = grid[r][c];
    if (ch === '.' || ch === 'F') continue;
    drawTile(ch, Math.round(c * T - camX), r * T + YOFF);
  }
  drawFlag();
  for (const e of enemies) {
    const x = Math.round(e.x - camX), y = Math.round(e.y) + YOFF;
    if (x < -20 || x > VW + 20) continue;
    if (e.dead) ctx.drawImage(GOOMBA, 0, 0, 14, 14, x, y + 9, 14, 5);
    else {
      ctx.save();
      if (Math.floor(frame / 10) % 2) { ctx.translate(x + 14, y); ctx.scale(-1, 1); ctx.drawImage(GOOMBA, 0, 0); }
      else ctx.drawImage(GOOMBA, x, y);
      ctx.restore();
    }
  }
  if (state !== 'title') drawPlayer();
  for (const f of effects) text(f.txt, Math.round(f.x - camX), Math.round(f.y) + YOFF, 6, '#fcfcfc');
  drawHUD();

  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, VW, VH);
    text('PIXEL PLUMBER BROS', VW / 2, 56, 20, '#fcb800', 'center');
    text('8-bit platformer', VW / 2, 84, 8, '#fcfcfc', 'center');
    if (Math.floor(frame / 30) % 2) text('PRESS ENTER', VW / 2, 124, 12, '#fcfcfc', 'center');
    text('ARROWS / WASD - MOVE   SPACE - JUMP', VW / 2, 160, 7, '#a4e4fc', 'center');
    ctx.drawImage(P_IDLE, VW / 2 - 6, 100 - 0);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, VW, VH);
    text('GAME OVER', VW / 2, 70, 24, '#e40058', 'center');
    text('SCORE ' + pad(score, 6), VW / 2, 108, 10, '#fcfcfc', 'center');
    if (stateT > 30) text('PRESS ENTER', VW / 2, 135, 10, '#fcfcfc', 'center');
  } else if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, VW, VH);
    text('LEVEL CLEAR!', VW / 2, 66, 22, '#fcb800', 'center');
    text('SCORE ' + pad(score, 6), VW / 2, 104, 10, '#fcfcfc', 'center');
    if (stateT > 30) text('PRESS ENTER', VW / 2, 130, 10, '#fcfcfc', 'center');
  }
}

// ---------- Цикл (фиксированный шаг 60 Гц) ----------
resetLevel();
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
